name: "Podcast Generator"
author: "chandraguphtan"
description: "Generator feed for Podcast from YAML file"
runs:
  using: "docker"
  image: "Dockerfile"
branding:
  icon: "git-branch"
  color: "red"
inputs:
  email:
    description: The Commiter's email address
    required: True
    default: ${{ github.actor }}@localhost
  name:
    description: The commiter's name
    required: True
    default: ${{ github.actor }}

  